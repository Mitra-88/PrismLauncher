name: Build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  merge_group:
    types: [checks_requested]
  pull_request:
  workflow_call:
    inputs:
      build-type:
        description: Type of build (Debug or Release)
        type: string
        default: Release
      environment:
        description: Deployment environment to run under
        type: string
  workflow_dispatch:
    inputs:
      build-type:
        description: Type of build (Debug or Release)
        type: string
        default: Release

permissions: {}

jobs:
  build:
    name: Build (${{ matrix.artifact-name }})

    environment: ${{ inputs.environment || '' }}

    permissions:
      contents: read
      # Required for Azure Trusted Signing
      id-token: write
      # Required for vcpkg binary cache
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact-name: Linux
            cmake-preset: release_fast_linux
            qt-version: 6.11.2

          - os: windows-2022
            artifact-name: Windows-MSVC
            cmake-preset: release_fast_windows_msvc
            # TODO(@getchoo): This is the default in setup-dependencies/windows. Why isn't it working?!?!
            vcvars-arch: amd64
            qt-version: 6.11.2

          - os: macos-26
            artifact-name: macOS
            cmake-preset: release_fast_macos_universal
            macosx-deployment-target: 14.0
            qt-version: 6.11.2

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: ${{ matrix.msystem != '' && 'msys2 {0}' || 'bash' }}

    env:
      ARTIFACT_NAME: ${{ matrix.artifact-name }}-Qt6
      BUILD_PLATFORM: official
      BUILD_TYPE: ${{ inputs.build-type || 'Debug' }}
      CMAKE_PRESET: ${{ matrix.cmake-preset }}

      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macosx-deployment-target }}

    steps:
      ##
      # SETUP
      ##

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup dependencies
        id: setup-dependencies
        uses: ./.github/actions/setup-dependencies
        with:
          build-type: ${{ env.BUILD_TYPE }}
          artifact-name: ${{ matrix.artifact-name }}
          msystem: ${{ matrix.msystem }}
          vcvars-arch: ${{ matrix.vcvars-arch }}
          qt-version: ${{ matrix.qt-version }}

      ##
      # BUILD
      ##

      - name: Configure project
        run: |
          cmake --preset "$CMAKE_PRESET" -D VCPKG_HOST_TRIPLET="$VCPKG_TRIPLET" -D VCPKG_TARGET_TRIPLET="$VCPKG_TRIPLET"

      - name: Run build
        run: |
          cmake --build --preset "$CMAKE_PRESET" --config "$BUILD_TYPE"

      - name: Run tests
        run: |
          ctest --preset "$CMAKE_PRESET" --build-config "$BUILD_TYPE"

      ##
      # PACKAGE
      ##

      - name: Get short version
        id: short-version
        shell: bash
        run: |
          echo "version=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Package (Linux)
        if: ${{ runner.os == 'Linux' }}
        uses: ./.github/actions/package/linux
        with:
          version: ${{ steps.short-version.outputs.version }}
          build-type: ${{ steps.setup-dependencies.outputs.build-type }}
          artifact-name: ${{ matrix.artifact-name }}
          qt-version: ${{ steps.setup-dependencies.outputs.qt-version }}

          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-private-key-id: ${{ secrets.GPG_PRIVATE_KEY_ID }}

      - name: Package (macOS)
        if: ${{ runner.os == 'macOS' }}
        uses: ./.github/actions/package/macos
        with:
          version: ${{ steps.short-version.outputs.version }}
          build-type: ${{ steps.setup-dependencies.outputs.build-type }}
          artifact-name: ${{ matrix.artifact-name }}

          apple-codesign-cert: ${{ secrets.APPLE_CODESIGN_CERT }}
          apple-codesign-password: ${{ secrets.APPLE_CODESIGN_PASSWORD }}
          apple-codesign-id: ${{ secrets.APPLE_CODESIGN_ID }}
          apple-notarize-apple-id: ${{ secrets.APPLE_NOTARIZE_APPLE_ID }}
          apple-notarize-team-id: ${{ secrets.APPLE_NOTARIZE_TEAM_ID }}
          apple-notarize-password: ${{ secrets.APPLE_NOTARIZE_PASSWORD }}
          sparkle-ed25519-key: ${{ secrets.SPARKLE_ED25519_KEY }}

      - name: Package (Windows)
        if: ${{ runner.os == 'Windows' }}
        uses: ./.github/actions/package/windows
        env:
          CI_HAS_ACCESS_TO_AZURE: ${{ vars.CI_HAS_ACCESS_TO_AZURE || '' }}
        with:
          version: ${{ steps.short-version.outputs.version }}
          build-type: ${{ steps.setup-dependencies.outputs.build-type }}
          artifact-name: ${{ matrix.artifact-name }}
          msystem: ${{ matrix.msystem }}

          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  nightly-release:
    name: Nightly release
    needs: build
    runs-on: ubuntu-24.04
    if: |
      github.repository == 'PrismLauncher/PrismLauncher' &&
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      github.event_name == 'workflow_dispatch'

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Get short SHA
        id: sha
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Prepare release files
        run: |
          mkdir -p release-files
          for dir in artifacts/*/; do
            name="$(basename "$dir")"
            mapfile -d '' files < <(find "$dir" -type f -print0)
            if [ "${#files[@]}" -eq 1 ]; then
              cp "${files[0]}" "release-files/${name}"
            else
              (cd "$dir" && zip -qr "$OLDPWD/release-files/${name}.zip" .)
            fi
          done
          ls -la release-files/

      - name: Generate release notes
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="${{ github.repository }}"
          SHA="${{ github.sha }}"
          SHORT_SHA="${{ steps.sha.outputs.short_sha }}"
          BRANCH="${{ github.ref_name }}"
          RUN_NUMBER="${{ github.run_number }}"
          BUILT_AT="$(date -u +'%Y-%m-%d %H:%M UTC')"

          PREV_SHA="$(git rev-list -n 1 refs/tags/nightly 2>/dev/null || true)"
          if [ -z "$PREV_SHA" ]; then
            PREV_SHA="$(git rev-list --max-parents=0 "$SHA")"
          fi

          CHANGES="$(git log "${PREV_SHA}..${SHA}" --pretty=format:'* %s (`%h`)' --no-merges | head -n 20)"
          if [ -z "$CHANGES" ]; then
            CHANGES="* No changes since last nightly"
          fi

          HASHES=""
          while IFS= read -r -d '' f; do
            name="$(basename "$f")"
            sha256="$(sha256sum "$f" | awk '{print $1}')"
            sha512="$(sha512sum "$f" | awk '{print $1}')"
            HASHES="${HASHES}* \`${name}\`\n  - SHA-256: \`${sha256}\`\n  - SHA-512: \`${sha512}\`\n"
          done < <(find release-files -type f -print0)

          {
            echo "**Automated Nightly Build**"
            echo "* **Build Number:** #${RUN_NUMBER}"
            echo "* **Branch:** [\`${BRANCH}\`](https://github.com/${REPO}/tree/${SHA})"
            echo "* **Commit:** [\`${SHORT_SHA}\`](https://github.com/${REPO}/commit/${SHA})"
            echo "* **Built on:** ${BUILT_AT}"
            echo ""
            echo "## 📝 Recent Changes"
            echo -e "$CHANGES"
            echo ""
            echo "## 🔐 File Hashes"
            echo -e "$HASHES"
          } > release_notes.md

          cat release_notes.md

      - name: Update nightly pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="nightly"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" release-files/* \
            --title "Nightly (build #${{ github.run_number }}, ${{ steps.sha.outputs.short_sha }})" \
            --notes-file release_notes.md \
            --target "${{ github.sha }}"
