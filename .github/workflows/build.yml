name: Build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel in-flight nightly (dispatched) or release (workflow_call) builds, only PR/merge-group runs
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

on:
  merge_group:
    types: [checks_requested]
  pull_request:
  workflow_call:
    inputs:
      environment:
        description: Deployment environment to run under
        type: string
  workflow_dispatch:

permissions: {}

env:
  # Latest stable Qt release, used on every platform
  QT_VERSION: 6.11.2
  # Release-only builds; debug builds are no longer produced in CI
  BUILD_TYPE: Release

jobs:
  prepare-nightly:
    name: Prepare nightly release
    runs-on: ubuntu-slim
    permissions:
      contents: write

    steps:
      - name: Reset the rolling nightly release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          # no checkout in this job, so gh cannot infer the repo from a git remote
          GH_REPO: ${{ github.repository }}
        run: |
          short_sha="${GITHUB_SHA::7}"

          prev_target="$(gh release view nightly --json targetCommitish --jq .targetCommitish 2>/dev/null || true)"
          {
            echo "**Automated Nightly Build**"
            echo "* **Build:** #${{ github.run_number }}"
            echo "* **Branch:** \`${GITHUB_REF_NAME}\`"
            echo "* **Commit:** [\`${short_sha}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})"
            echo "* **Started:** $(date -u +'%Y-%m-%d %H:%M UTC')"
            echo ""
            echo "Assets are uploaded here as each platform finishes building."
          } > release-notes.md

          if [ -n "$prev_target" ] && [ "$prev_target" != "$GITHUB_SHA" ]; then
            changelog="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${prev_target}...${GITHUB_SHA}" \
              --jq '.commits[] | "* " + (.commit.message | split("\n")[0]) + " (`" + .sha[0:7] + "`")' 2>/dev/null | head -20 || true)"
            if [ -n "$changelog" ]; then
              {
                echo ""
                echo "## Recent changes"
                echo "$changelog"
              } >> release-notes.md
            fi
          fi

          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Nightly (build #${{ github.run_number }}, ${short_sha})" \
            --notes-file release-notes.md

  build:
    needs: prepare-nightly

    environment: ${{ inputs.environment || '' }}

    permissions:
      contents: write
      # Required for Azure Trusted Signing
      id-token: write
      # Required for vcpkg binary cache
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact-name: Linux
            cmake-preset: linux

          - os: windows-2022
            artifact-name: Windows-MSVC
            cmake-preset: windows_msvc
            vcvars-arch: amd64

          - os: macos-26
            artifact-name: macOS
            cmake-preset: macos_arm64
            macosx-deployment-target: 13.0

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    env:
      ARTIFACT_NAME: ${{ matrix.artifact-name }}-Qt6
      BUILD_PLATFORM: official
      CMAKE_PRESET: ${{ matrix.cmake-preset }}

      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macosx-deployment-target }}

    steps:
      ##
      # SETUP
      ##

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Setup dependencies
        id: setup-dependencies
        uses: ./.github/actions/setup-dependencies
        with:
          build-type: ${{ env.BUILD_TYPE }}
          artifact-name: ${{ matrix.artifact-name }}
          vcvars-arch: ${{ matrix.vcvars-arch }}
          qt-version: ${{ env.QT_VERSION }}

      ##
      # BUILD
      ##

      - name: Configure project
        run: |
          # the debug info format must be a cache variable so it applies to cmake's
          # compiler test: sccache cannot handle the /Zi PDB the test uses by default
          cmake --preset "$CMAKE_PRESET" -D VCPKG_HOST_TRIPLET="$VCPKG_TRIPLET" -D VCPKG_TARGET_TRIPLET="$VCPKG_TRIPLET" -D BUILD_TESTING=OFF \
            -D CMAKE_POLICY_DEFAULT_CMP0141=NEW \
            -D "CMAKE_MSVC_DEBUG_INFORMATION_FORMAT=$<$<CONFIG:Debug,RelWithDebInfo>:Embedded>"

      - name: Run build
        run: |
          cmake --build --preset "$CMAKE_PRESET" --config "$BUILD_TYPE"

      ##
      # PACKAGE
      ##

      - name: Get short version
        id: short-version
        shell: bash
        run: |
          echo "version=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Package (Linux)
        if: ${{ runner.os == 'Linux' }}
        uses: ./.github/actions/package/linux
        with:
          version: ${{ steps.short-version.outputs.version }}
          build-type: ${{ env.BUILD_TYPE }}
          artifact-name: ${{ matrix.artifact-name }}
          qt-version: ${{ env.QT_VERSION }}

          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-private-key-id: ${{ secrets.GPG_PRIVATE_KEY_ID }}

      - name: Package (macOS)
        if: ${{ runner.os == 'macOS' }}
        uses: ./.github/actions/package/macos
        with:
          version: ${{ steps.short-version.outputs.version }}
          build-type: ${{ env.BUILD_TYPE }}
          artifact-name: ${{ matrix.artifact-name }}

          apple-codesign-cert: ${{ secrets.APPLE_CODESIGN_CERT }}
          apple-codesign-password: ${{ secrets.APPLE_CODESIGN_PASSWORD }}
          apple-codesign-id: ${{ secrets.APPLE_CODESIGN_ID }}
          apple-notarize-apple-id: ${{ secrets.APPLE_NOTARIZE_APPLE_ID }}
          apple-notarize-team-id: ${{ secrets.APPLE_NOTARIZE_TEAM_ID }}
          apple-notarize-password: ${{ secrets.APPLE_NOTARIZE_PASSWORD }}
          sparkle-ed25519-key: ${{ secrets.SPARKLE_ED25519_KEY }}

      - name: Package (Windows)
        if: ${{ runner.os == 'Windows' }}
        uses: ./.github/actions/package/windows
        env:
          CI_HAS_ACCESS_TO_AZURE: ${{ vars.CI_HAS_ACCESS_TO_AZURE || '' }}
        with:
          version: ${{ steps.short-version.outputs.version }}
          build-type: ${{ env.BUILD_TYPE }}
          artifact-name: ${{ matrix.artifact-name }}

          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      ##
      # NIGHTLY
      ##

      - name: Upload nightly assets
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short_sha="${GITHUB_SHA::7}"
          mkdir -p nightly-assets

          case "$RUNNER_OS" in
            Linux)
              mv PrismLauncher-Linux-*.AppImage "nightly-assets/PrismLauncher-Linux-${short_sha}-x86_64.AppImage"
              mv PrismLauncher-portable.tar.gz "nightly-assets/PrismLauncher-Linux-Qt6-Portable-${short_sha}.tar.gz"
              ;;
            macOS)
              cp PrismLauncher.zip "nightly-assets/PrismLauncher-macOS-${short_sha}.zip"
              cp PrismLauncher.dmg "nightly-assets/PrismLauncher-macOS-${short_sha}.dmg"
              ;;
            Windows)
              (cd install-portable && "/c/Program Files/7-Zip/7z.exe" a -tzip "../nightly-assets/PrismLauncher-Windows-MSVC-Portable-${short_sha}.zip" *)
              cp PrismLauncher-Setup.exe "nightly-assets/PrismLauncher-Windows-MSVC-Setup-${short_sha}.exe"
              ;;
          esac

          cd nightly-assets
          # bash on macOS is 3.2, ${var,,} is not available there
          os_name="$(printf '%s' "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')"
          if command -v sha256sum > /dev/null 2>&1; then
            sha256sum -- * > "SHA256SUMS-$os_name.txt"
          else
            shasum -a 256 -- * > "SHA256SUMS-$os_name.txt"
          fi
          gh release upload nightly --clobber --repo "$GITHUB_REPOSITORY" *
