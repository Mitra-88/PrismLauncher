name: Setup Dependencies
description: Install and setup dependencies for building Prism Launcher

inputs:
  build-type:
    description: Type for the build
    required: true
    default: Release
  artifact-name:
    description: Name of the uploaded artifact
    required: true
  vcvars-arch:
    description: Visual Studio architecture to use
    required: false
  qt-architecture:
    description: Qt architecture
    required: false
  qt-version:
    description: Version of Qt to use
    required: true

outputs:
  build-type:
    description: Type of build used
    value: ${{ inputs.build-type }}
  qt-version:
    description: Version of Qt used
    value: ${{ inputs.qt-version }}

runs:
  using: composite

  steps:
    - name: Setup Linux dependencies
      if: ${{ runner.os == 'Linux' }}
      uses: ./.github/actions/setup-dependencies/linux

    # vcpkg builds Linux dependencies from source, cache them with the GitHub Actions cache backend
    - name: Export GitHub Actions cache environment (Linux vcpkg cache)
      if: ${{ runner.os == 'Linux' }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
          core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

    - name: Setup vcpkg cache (Linux)
      if: ${{ runner.os == 'Linux' }}
      shell: bash
      run: |
        echo "VCPKG_BINARY_SOURCES=clear;x-gha,readwrite" >> "$GITHUB_ENV"

    - name: Setup macOS dependencies
      if: ${{ runner.os == 'macOS' }}
      uses: ./.github/actions/setup-dependencies/macos
      with:
        build-type: ${{ inputs.build-type }}

    - name: Setup Windows dependencies
      if: ${{ runner.os == 'Windows' }}
      uses: ./.github/actions/setup-dependencies/windows
      with:
        build-type: ${{ inputs.build-type }}
        vcvars-arch: ${{ inputs.vcvars-arch }}

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
      with:
        variant: sccache
        create-symlink: ${{ runner.os != 'Windows' }}
        # unique save key per run plus a prefix fallback, so every build adds its
        # new objects to the cache instead of freezing on the first saved entry
        append-timestamp: true
        key: ${{ runner.os }}-${{ runner.arch }}-${{ inputs.artifact-name }}-${{ inputs.build-type }}-sccache
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-${{ inputs.artifact-name }}-${{ inputs.build-type }}-sccache
        max-size: 1G

    - name: Use ccache
      shell: bash
      run: |
        echo "CMAKE_C_COMPILER_LAUNCHER=sccache" >> "$GITHUB_ENV"
        echo "CMAKE_CXX_COMPILER_LAUNCHER=sccache" >> "$GITHUB_ENV"

    - name: Determine vcpkg triplet
      shell: bash
      run: |
        declare vcpkg_arch vcpkg_platform

        case "$RUNNER_ARCH" in
        "X64")
        	vcpkg_arch=x64
        	;;
        "ARM64")
          vcpkg_arch=arm64
          ;;
        *)
        	echo "# 🚨 The architecture \"$RUNNER_ARCH\" is not supported by vcpkg in CI!" >>"$GITHUB_STEP_SUMMARY"
        	exit 1
        	;;
        esac

        case "$RUNNER_OS" in
        "Linux")
        	vcpkg_platform=linux
        	;;
        "macOS")
        	vcpkg_platform=osx
        	;;
        "Windows")
        	vcpkg_platform=windows
        	;;
        *)
        	echo "# 🚨 The platform \"$platform\" is not supported by vcpkg in CI!" >>"$GITHUB_STEP_SUMMARY"
        	exit 1
        	;;
        esac

        echo "VCPKG_TRIPLET=$vcpkg_arch-$vcpkg_platform" >> "$GITHUB_ENV"

    # old python versions detect 7z files as zip, breaking aqtinstall. see https://github.com/miurahr/aqtinstall/issues/1042
    - name: Update Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.14'

    - name: Install Qt
      uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
      with:
        version: ${{ inputs.qt-version }}
        setup-python: false
        aqtsource: git+https://github.com/miurahr/aqtinstall.git@16db45a70b5905ad596941b223469bc86a56901e
        modules: qtimageformats qtnetworkauth
        cache: true

    - name: Set Qt6_DIR
      shell: bash
      run: |
        echo "Qt6_DIR=$QT_ROOT_DIR" >> "$GITHUB_ENV"
