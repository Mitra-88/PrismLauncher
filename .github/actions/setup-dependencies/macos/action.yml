name: Setup macOS dependencies

inputs:
  build-type:
    description: Type for the build
    required: true
    default: Release

runs:
  using: composite

  steps:
    - name: Install dependencies
      shell: bash
      # no brew update: the image index is fresh enough, updating costs ~40s
      # temurin 17 and the jdk toolchain come preinstalled, java_home finds them
      # no mono: the vcpkg cache no longer uses the nuget backend
      run: |
        brew install ninja extra-cmake-modules

    - name: Set JAVA_HOME
      shell: bash
      run: |
        echo "JAVA_HOME=$(/usr/libexec/java_home -v 17)" >> "$GITHUB_ENV"

    - name: Setup vcpkg environment
      shell: bash
      run: |
        echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"
